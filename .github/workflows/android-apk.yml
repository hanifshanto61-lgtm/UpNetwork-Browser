name: Build Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - "source.zip"
      - ".github/workflows/android-apk.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Extract source
        run: |
          unzip -o source-fixed2-next.zip-d .
          test -f UpNetwork-Browser/android/app/build.gradle.kts

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install SDK packages
        run: |
          sdkmanager --install "platforms;android-35" "platforms;android-36" "build-tools;35.0.0" "build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Set Java target to 17
        working-directory: UpNetwork-Browser/android/app
        run: |
          sed -i 's/VERSION_1_8/VERSION_17/g' build.gradle.kts

      - name: Build APK
        working-directory: UpNetwork-Browser/android
        run: gradle --no-daemon :app:assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: UpNetwork-Browser-debug-apk
          path: UpNetwork-Browser/android/app/build/outputs/apk/debug/app-debug.apk
