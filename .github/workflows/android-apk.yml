name: Build Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - "source.zip"
      - ".github/workflows/android-apk.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract source
        run: |
          unzip -o source.zip -d .
          test -f UpNetwork-Browser/android/app/build.gradle.kts

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3
     - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build APK
        working-directory: UpNetwork-Browser/android
        run: gradle --no-daemon :app:assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: UpNetwork-Browser-debug-apk
          path: UpNetwork-Browser/android/app/build/outputs/apk/debug/app-debug.apk
